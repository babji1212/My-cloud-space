{% extends "base.html" %}{% from "_assign_grid.html" import grid %}
{% block body %}
<h1>✏️ Edit class teacher</h1><p class="sub"><a href="{{ url_for('class_teachers') }}" style="color:var(--pri)">← All class teachers</a></p>
<form method="post" class="card"><div class="fg">
  <div><label>Teacher name</label><input name="name" value="{{ t.name }}" required></div>
  <div><label>Username</label><input name="username" value="{{ t.username }}" required pattern="[A-Za-z0-9._\-]{3,30}"></div>
  <div><label>Mobile number</label><input name="phone" value="{{ t.phone }}"></div>
  <div style="display:flex;flex-direction:column;justify-content:flex-end;gap:6px">
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;font-weight:600;margin:0"><input type="checkbox" name="active" style="width:auto;margin:0" {{ 'checked' if t.active }}> Account is active (can log in)</label>
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px;font-weight:600;margin:0"><input type="checkbox" name="reset" style="width:auto;margin:0"> Generate a new password</label></div>
  <div class="full"><label>Classes and sections this teacher looks after</label>{{ grid(classes, sections, chosen) }}</div></div>
<p style="margin:12px 0 0"><button class="btn">💾 Save</button> <a class="btn g" href="{{ url_for('class_teachers') }}">Cancel</a></p></form>
<form method="post" class="card" style="margin-top:14px" onsubmit="return confirm('Delete this class teacher account?')"><input type="hidden" name="act" value="delete"><button class="btn r">🗑️ Delete this teacher account</button></form>
{% endblock %}
