{% extends "base.html" %}
{% block body %}
<h1>✏️ Edit parent login</h1><p class="sub"><a href="{{ url_for('parents_admin') }}" style="color:var(--pri)">← All parent logins</a></p>
<form method="post" class="card"><div class="fg">
  <div><label>Parent name</label><input name="name" value="{{ p.name }}"></div>
  <div><label>Username</label><input name="username" value="{{ p.username }}" required></div>
  <div class="full"><label>New password (leave blank to keep the current one)</label><input name="pin" placeholder="Type a new password to reset it"></div>
  <div class="full"><label style="display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:500;font-size:14px"><input type="checkbox" name="reset_default" style="width:auto;margin:0"> Reset to the default password (the parent must set a new one at the next login)</label></div>
  <div class="full"><label>Children linked to this login</label><input id="sf" placeholder="Type to filter students…"><div class="chk" id="chk">
    {% for s in students %}<label><input type="checkbox" name="students" value="{{ s.id }}" {{ 'checked' if s.id in ids }}> {{ s.name }} · Class {{ s.cls }}{% if s.roll %} · Roll {{ s.roll }}{% endif %}</label>{% endfor %}</div></div>
</div><p style="margin-bottom:0"><button class="btn">💾 Save</button> <a class="btn g" href="{{ url_for('parents_admin') }}">Cancel</a></p></form>
<script>document.getElementById('sf').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#chk label').forEach(l=>l.style.display=l.textContent.toLowerCase().includes(q)?'':'none')}</script>
{% endblock %}
